name: Something is wrong
description: Tell us what happened.
body:
  - type: markdown
    attributes:
      value: "Issues are public. Don't paste tokens, API keys or private logs."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slAIve version
      description: The name of the zip you downloaded, e.g. slAIve-0.1.1-2.zip
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
